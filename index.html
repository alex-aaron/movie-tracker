<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Movie Tracker</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel='stylesheet' href="styles.css" />
  </head>
  <body>
    <h3 class='text-center'>Movie Tracker</h3>

    <form id="movie-submit-form">
      <div class="form-row submit-container">
        <div class="form-group col-md-6">
          <label for="title">Title</label>
          <input type="text" class="form-control" id="title" placeholder="Title">
        </div>
        <div class="form-group col-md-6">
          <label for="Year">Year</label>
          <input type="text" class="form-control" id="year" placeholder="Year">
        </div>
        <div class="form-group col-md-6">
          <label for="Director">Director</label>
          <input type="text" class="form-control" id="director" placeholder="Director">
        </div>
       <div class="form-group col-md-6">
          <label for="Watch">Director</label>
          <input type="text" class="form-control" id="watch" placeholder="Watch">
        </div>
      </div>
     
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <script src="data.js"></script>
    <script src="index.js"></script>
  </body>
</html>
